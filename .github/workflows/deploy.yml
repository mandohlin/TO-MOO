name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # Installs node + pnpm at the exact versions pinned in .mise.toml
      - uses: jdx/mise-action@v2

      - run: pnpm install --frozen-lockfile

      - name: Build
        # vite.config.ts uses FIGMA_PUBLIC_URL as the base path; Pages serves the repo under /<repo-name>/
        run: FIGMA_PUBLIC_URL="/${{ github.event.repository.name }}" pnpm build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
